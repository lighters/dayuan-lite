[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dayuan-lite"
version = "0.3.0"
description = "Lightweight CLI and stdio MCP connector for WeCom Dayuan read-only A2A queries"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/lighters/dayuan-lite"

[project.scripts]
dayuan = "dayuan:main"

[tool.setuptools]
py-modules = ["dayuan", "workbuddy_auth"]

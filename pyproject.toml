[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dayuan-lite"
dynamic = ["version"]
description = "Read-only WeCom Dayuan A2A and user-authorized CLI connector"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/lighters/dayuan-lite"

[project.scripts]
dayuan = "dayuan:main"

[tool.setuptools]
py-modules = ["dayuan", "workbuddy_auth", "wecom_bridge"]

[tool.setuptools.dynamic]
version = {attr = "dayuan.__version__"}

[tool.setuptools.data-files]
"share/dayuan-lite/skills/dayuan-readonly" = ["skills/dayuan-readonly/SKILL.md", "skills/dayuan-readonly/references.md"]
